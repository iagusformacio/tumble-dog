<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#140a32">
<title>TUMBLE DOG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0d0820;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  body{display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box}
  #game-frame{position:relative;line-height:0}
  canvas{display:block;box-shadow:0 0 60px rgba(120,60,255,.35)}
  #language-selector{position:absolute;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));display:flex;align-items:center;gap:6px;padding:5px 7px;border:2px solid rgba(255,225,77,.7);border-radius:12px;background:rgba(20,10,50,.88);color:#fff;font:14px Bangers,Impact,sans-serif;line-height:1;z-index:2}
  #language-selector[hidden]{display:none}
  #language-selector button{min-width:42px;min-height:32px;border:1px solid #6b5a9a;border-radius:7px;background:#241644;color:#fff;font:inherit;padding:5px 9px;cursor:pointer;touch-action:manipulation}
  #language-selector button[aria-pressed="true"]{background:#ffe14d;color:#1a1030;border-color:#fff}
  #language-selector button:focus-visible{outline:3px solid #9fe7ff;outline-offset:2px}
  #language-selector .language-key{color:#ffb3d9;font-size:12px}
  @media (max-width:700px),(max-height:500px){#language-selector{gap:3px;padding:3px 4px;font-size:11px;top:4px;right:4px}#language-selector button{min-height:28px;padding:4px 6px}#language-selector .language-key{display:none}}
  #touchpad{position:fixed;inset:0;pointer-events:none;touch-action:none}
  .stick,.lever{pointer-events:auto;touch-action:none;-webkit-tap-highlight-color:transparent}
  .stick{position:absolute;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));width:clamp(90px,24vmin,140px);aspect-ratio:1;border:3px solid rgba(255,255,255,.55);border-radius:50%;background:rgba(20,10,50,.38);box-sizing:border-box}
  .stick-knob{position:absolute;inset:25%;border-radius:50%;background:rgba(255,255,255,.55);border:2px solid #1a1030;box-sizing:border-box;pointer-events:none}
  .stick.on .stick-knob{background:rgba(255,225,77,.75)}
  .levers{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:clamp(8px,2vmin,18px);align-items:end}
  .lever{position:relative;width:clamp(64px,17vmin,100px);height:clamp(75px,20vmin,115px);border:2px solid rgba(255,255,255,.6);border-radius:18px;background:rgba(20,10,50,.45);color:#fff;font:clamp(12px,3vmin,20px) Bangers,Impact,sans-serif;text-shadow:0 2px 2px #000;padding:0;display:flex;align-items:end;justify-content:center}
  .lever:before{content:'';position:absolute;top:18%;left:46%;width:8%;height:38%;border-radius:8px;background:#eee;transform-origin:bottom;transition:transform .1s}
  .lever:after{content:'';position:absolute;top:8%;left:35%;width:30%;aspect-ratio:1;border-radius:50%;background:#ff4fa3;box-shadow:0 1px 2px #111;transition:transform .1s}
  .lever.shoot:after{background:#ffe14d}.lever.on:before{transform:rotate(35deg)}.lever.on:after{transform:translate(12px,12px)}
  .lever span{margin-bottom:8px;position:relative}
  .orientation-hint{display:none;position:absolute;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:4px 10px;border-radius:12px;background:rgba(20,10,50,.65);color:white;white-space:nowrap;font:14px Impact,sans-serif}
  @media (orientation:portrait){.orientation-hint{display:block}}

</style>
</head>
<body>
<div id="game-frame">
  <canvas id="game" width="1280" height="720" aria-describedby="game-help"></canvas>
  <div id="language-selector" role="group" hidden>
    <span class="language-key" aria-hidden="true">L</span>
    <button type="button" data-language="es" aria-pressed="true">Castellano</button>
    <button type="button" data-language="val" aria-pressed="false">Valencià</button>
  </div>
</div>
<p id="game-help" hidden></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
