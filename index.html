<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Tumble Dog</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#181c2c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="./assets/ui/icon-192.png">
<style>
  html,body{margin:0;width:100%;height:100%;background:#111;overflow:hidden;overscroll-behavior:none}
  body{display:grid;place-items:center;touch-action:manipulation}
  body{display:grid;place-items:center}
  canvas{display:block;max-width:100%;max-height:100%;image-rendering:pixelated}
  .touch-controls{position:fixed;inset:auto 0 0;display:none;align-items:flex-end;gap:8px;padding:12px;z-index:2;pointer-events:none}
  .touch-control{min-width:48px;min-height:48px;padding:8px;border:2px solid #fff;border-radius:8px;background:#171717cc;color:#fff;font:700 12px monospace;touch-action:none;pointer-events:auto;user-select:none;-webkit-user-select:none}
  .touch-control-left{margin-right:-8px}.touch-control-right{margin-right:auto}
  @media (pointer:coarse){.touch-controls{display:flex}}
</style>
</head>
<body>
<canvas id="game" width="320" height="224"></canvas>
<script type="module" src="./src/main.js"></script>
<script>
// T12: PWA offline (service worker cache-first). En localhost/127.0.0.1 vale; si falla, se ignora.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
