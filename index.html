<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#140a32">
<!-- PWA (issue #105): instalable y a pantalla completa. En iPhone es la única
     forma fiable de jugar en horizontal y sin barras: «Añadir a pantalla de inicio». -->
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./assets/icons/favicon.png" sizes="48x48" type="image/png">
<link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tumble Dog">
<meta name="format-detection" content="telephone=no">
<title>TUMBLE DOG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0d0820;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  /* El hueco del 16:9 se pinta con el degradado del propio juego: en un móvil
     20:9 a pantalla completa los lados no quedan negros. */
  body{display:flex;align-items:center;justify-content:center;background:radial-gradient(120% 100% at 50% 0,#241056 0%,#0d0820 62%,#07040f 100%);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box}
  #game-frame{position:relative;line-height:0}
  canvas{display:block;box-shadow:0 0 60px rgba(120,60,255,.35)}
  body.fullscreen canvas{box-shadow:none}
  #language-selector{position:absolute;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));display:flex;align-items:center;gap:6px;padding:5px 7px;border:2px solid rgba(255,225,77,.7);border-radius:12px;background:rgba(20,10,50,.88);color:#fff;font:14px Bangers,Impact,sans-serif;line-height:1;z-index:2}
  #language-selector[hidden]{display:none}
  #language-selector button{min-width:42px;min-height:32px;border:1px solid #6b5a9a;border-radius:7px;background:#241644;color:#fff;font:inherit;padding:5px 9px;cursor:pointer;touch-action:manipulation}
  #language-selector button[aria-pressed="true"]{background:#ffe14d;color:#1a1030;border-color:#fff}
  #language-selector button:focus-visible{outline:3px solid #9fe7ff;outline-offset:2px}
  #language-selector .language-key{color:#ffb3d9;font-size:12px}
  @media (max-width:700px),(max-height:500px){#language-selector{gap:3px;padding:3px 4px;font-size:11px;top:4px;right:4px}#language-selector button{min-height:28px;padding:4px 6px}#language-selector .language-key{display:none}}
  #touchpad{position:fixed;inset:0;pointer-events:none;touch-action:none}
  .stick,.lever{pointer-events:auto;touch-action:none;-webkit-tap-highlight-color:transparent}
  .stick{position:absolute;left:max(14px,env(safe-area-inset-left));bottom:max(14px,env(safe-area-inset-bottom));width:clamp(90px,24vmin,140px);aspect-ratio:1;border:3px solid rgba(255,255,255,.55);border-radius:50%;background:rgba(20,10,50,.38);box-sizing:border-box}
  .stick-knob{position:absolute;inset:25%;border-radius:50%;background:rgba(255,255,255,.55);border:2px solid #1a1030;box-sizing:border-box;pointer-events:none}
  .stick.on .stick-knob{background:rgba(255,225,77,.75)}
  .levers{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:clamp(8px,2vmin,18px);align-items:end}
  .lever{position:relative;width:clamp(64px,17vmin,100px);height:clamp(75px,20vmin,115px);border:2px solid rgba(255,255,255,.6);border-radius:18px;background:rgba(20,10,50,.45);color:#fff;font:clamp(12px,3vmin,20px) Bangers,Impact,sans-serif;text-shadow:0 2px 2px #000;padding:0;display:flex;align-items:end;justify-content:center}
  .lever:before{content:'';position:absolute;top:18%;left:46%;width:8%;height:38%;border-radius:8px;background:#eee;transform-origin:bottom;transition:transform .1s}
  .lever:after{content:'';position:absolute;top:8%;left:35%;width:30%;aspect-ratio:1;border-radius:50%;background:#ff4fa3;box-shadow:0 1px 2px #111;transition:transform .1s}
  .lever.shoot:after{background:#ffe14d}.lever.on:before{transform:rotate(35deg)}.lever.on:after{transform:translate(12px,12px)}
  .lever span{margin-bottom:8px;position:relative}
  .orientation-hint{display:none;position:absolute;top:max(8px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:4px 10px;border-radius:12px;background:rgba(20,10,50,.65);color:white;white-space:nowrap;font:14px Impact,sans-serif}
  @media (orientation:portrait){.orientation-hint{display:block}}
  /* Con el aviso de girar (debajo) el mini-cartel de los controles sobra. */
  body.rotating .orientation-hint{display:none}

  /* ——— aviso «GIRA EL MÓVIL»: pantalla completa, bloquea el juego y lo pausa */
  #rotate{position:fixed;inset:0;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2.6vh;text-align:center;color:#fff;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box;background:radial-gradient(120% 100% at 50% 38%,#31166f 0%,#140a32 58%,#07040f 100%);touch-action:none}
  body.rotating #rotate{display:flex}
  #rotate h2{margin:0;font:clamp(28px,8vmin,60px)/1 Bangers,Impact,sans-serif;letter-spacing:.06em;text-shadow:0 4px 0 #000,0 0 26px rgba(255,225,77,.35)}
  #rotate p{margin:0;max-width:min(80vw,42ch);font:clamp(12px,3.2vmin,18px)/1.4 Impact,Bangers,sans-serif;opacity:.82}
  #rotate .phone{position:relative;width:clamp(54px,15vmin,104px);aspect-ratio:3/4;border:4px solid #ffe14d;border-radius:12%;background:rgba(255,225,77,.08);animation:td-turn 2.4s cubic-bezier(.65,.05,.36,1) infinite}
  #rotate .phone i{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);width:26%;height:5%;border-radius:4px;background:#ffe14d;opacity:.75}
  #rotate .phone:after{content:'';position:absolute;top:-38%;right:-30%;width:56%;aspect-ratio:1;border:3px dashed rgba(255,225,77,.55);border-left-color:transparent;border-bottom-color:transparent;border-radius:50%;animation:td-arrow 2.4s cubic-bezier(.65,.05,.36,1) infinite}
  @keyframes td-turn{0%,15%{transform:rotate(0deg)}55%,90%{transform:rotate(-90deg)}100%{transform:rotate(0deg)}}
  @keyframes td-arrow{0%,15%{transform:rotate(0deg);opacity:.2}55%,90%{transform:rotate(-90deg);opacity:.9}100%{transform:rotate(0deg);opacity:.2}}
  @media (prefers-reduced-motion:reduce){#rotate .phone{animation:none;transform:rotate(-45deg)}#rotate .phone:after{animation:none}}

  /* ——— pantalla completa: botón en el título (la tecla es F) y aviso de instalar */
  #fsbtn,#install{position:fixed;z-index:40;display:none}
  #fsbtn button,#install button{font:clamp(11px,2.6vmin,15px) Bangers,Impact,sans-serif;letter-spacing:.05em;color:#fff;background:rgba(20,10,50,.62);border:2px solid rgba(255,255,255,.45);border-radius:14px;padding:7px 12px;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  #fsbtn{top:max(8px,env(safe-area-inset-top));left:max(8px,env(safe-area-inset-left))}
  body.touch.at-title:not(.rotating) #fsbtn{display:block}
  #install{left:50%;bottom:max(10px,env(safe-area-inset-bottom));transform:translateX(-50%);align-items:center;gap:10px;max-width:min(94vw,54ch)}
  #install span{font:clamp(11px,2.8vmin,16px)/1.3 Impact,Bangers,sans-serif;color:#ffe9a8;background:rgba(20,10,50,.72);border:1px solid rgba(255,225,77,.4);border-radius:14px;padding:8px 4px 8px 12px}
  #install button{padding:6px 11px;font-size:1.2em;line-height:1}
  body.ask-install:not(.rotating) #install{display:flex}
</style>
</head>
<body>
<div id="game-frame">
  <canvas id="game" width="1280" height="720" aria-describedby="game-help"></canvas>
  <div id="language-selector" role="group" hidden>
    <span class="language-key" aria-hidden="true">L</span>
    <button type="button" data-language="es" aria-pressed="true">Castellano</button>
    <button type="button" data-language="val" aria-pressed="false">Valencià</button>
  </div>
</div>
<p id="game-help" hidden></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
