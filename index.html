<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#140a32">
<title>Tumble Dog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0d0820;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  body{display:flex;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box}
  canvas{display:block;box-shadow:0 0 60px rgba(120,60,255,.35)}
  #touchpad{position:fixed;inset:0;pointer-events:none}
  .tbtn{position:absolute;pointer-events:auto;border:3px solid #1a1030;border-radius:50%;background:rgba(255,255,255,.22);color:#fff;
    font:22px Bangers,Impact,sans-serif;width:78px;height:78px;backdrop-filter:blur(2px);text-shadow:0 2px 0 #1a1030;touch-action:none}
  .tbtn.on{background:rgba(255,225,77,.6)}
  .l1{left:18px;bottom:24px}.l2{left:108px;bottom:24px}.l3{left:63px;bottom:110px;width:62px;height:62px}
  .r1{right:18px;bottom:24px;width:92px;height:92px;background:rgba(255,79,163,.35)}
  .r2{right:124px;bottom:24px;background:rgba(77,210,255,.35)}.r3{right:60px;bottom:128px;background:rgba(255,225,77,.35)}
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<script type="module" src="./src/main.js"></script>
</body>
</html>
